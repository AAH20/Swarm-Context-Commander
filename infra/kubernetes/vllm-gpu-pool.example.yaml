# Design example only. Pin a real image, model weights, GPU type and storage.
# vLLM model loading and GPU cost make a warm floor preferable for latency-sensitive traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarm-context-commander-vllm
  namespace: swarm-context-commander
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swarm-context-commander-vllm
  template:
    metadata:
      labels:
        app: swarm-context-commander-vllm
    spec:
      containers:
        - name: vllm
          image: replace-with-pinned-vllm-image@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          args: ["serve", "replace-with-model-path"]
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
