# Design example only. Requires KEDA, a real queue, and an implemented worker Deployment.
# Do not apply unchanged: the address and Deployment name are placeholders.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: swarm-context-commander-cpu-worker
  namespace: swarm-context-commander
spec:
  scaleTargetRef:
    name: replace-with-real-worker-deployment
  minReplicaCount: 0
  maxReplicaCount: 100
  cooldownPeriod: 300
  triggers:
    - type: redis
      metadata:
        address: replace-with-real-redis-address:6379
        listName: swarm-context-commander-readonly-work
        listLength: "10"
