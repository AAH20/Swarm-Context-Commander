[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmcontext-plane"
version = "0.1.0"
description = "Inspectable context and admission kernel for large logical agent fleets"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
swarmcontext = "swarmcontext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
