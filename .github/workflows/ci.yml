name: Test and verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m swarmcontext demo --output outputs/demo.json
      - run: PYTHONPATH=src python -m swarmcontext eval-graph --output outputs/graph-eval-ci.json
      - run: PYTHONPATH=src python -m swarmcontext bench-fleet --agents 1000 --active-tasks 100 --tenants 10 --output outputs/fleet-ci.json
      - run: >-
          PYTHONPATH=src python -m swarmcontext context-cognee
          --query "refund reconciliation" --tenant synthetic-tenant --agent analyst-1
          --response-file fixtures/cognee-chunks.synthetic.json
          --output outputs/context-synthetic.json
  mcp-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[mcp]'
      - run: python -m unittest discover -s tests -v
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/test_atlas.cjs
      - run: node --check listings/huggingface-space/atlas-core.js
      - run: node --check listings/huggingface-space/atlas.js
      - run: node scripts/render-atlas-preview.cjs --check
